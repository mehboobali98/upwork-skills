schema_version: "1.0"
name: below-floor
description: "A full-time AI post paying $15-20/hr, under the $25 floor; its search row can't be found."
context:
  scaffold_script: setup.sh
execution:
  prompt: "What do you think of this Upwork job? https://www.upwork.com/jobs/~022112409205120428441"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write]
runs: 3
graders:
  - type: "regex"
    name: "verdict"
    pattern: "^\\W{0,6}SKIP\\b"
  - type: "regex"
    name: "rate-below-floor"
    pattern: "rate-below-floor"
    flags: "i"
  - type: "regex"
    name: "age-unknown"
    pattern: "unknown"
    flags: "i"
  - type: "tool_used"
    name: "ran-job-rules"
    tool: "Bash"
    input_match: "fixed_rules\\.py.{0,4}--job"
    min: 1
    weight: 0.5
  - type: "regex"
    name: "profile-org-uid"
    target: "mock_calls"
    pattern: "1000000000000000001"
    weight: 0.5
