schema_version: "1.0"
name: coach
description: "A Claude Code coaching post whose paid hours and outcomes earn the coaching override; the client's history is unrelated work."
context:
  scaffold_script: setup.sh
execution:
  prompt: "Is this Upwork post worth my Connects? https://www.upwork.com/jobs/~022112569628814312909"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write]
runs: 3
graders:
  - type: "regex"
    name: "verdict"
    pattern: "^\\W{0,6}(?:MAYBE|BID)\\b"
  - type: "regex"
    name: "coaching-override"
    pattern: "coaching-ask"
    flags: "i"
  - type: "tool_used"
    name: "ran-job-rules"
    tool: "Bash"
    input_match: "fixed_rules\\.py.{0,4}--job"
    min: 1
    weight: 0.5
  - type: "regex"
    name: "profile-org-uid"
    target: "mock_calls"
    pattern: "1000000000000000001"
    weight: 0.5
