schema_version: "1.0"
name: no-fire-connects
description: "Upwork-related, but not a post to screen: screen must not run."
context:
  scaffold_script: setup.sh
execution:
  prompt: "How do Connects work on Upwork, and roughly how many does a proposal cost?"
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write]
runs: 3
graders:
  - type: "regex"
    name: "explains-connects"
    pattern: "Connects"
    flags: "i"
  - type: "tool_used"
    name: "no-screen"
    tool: "Skill"
    input_match: "screen"
    min: 0
    max: 0
    arm: "both"
  - type: "tool_used"
    name: "no-fetch"
    tool: "mcp__upwork__find_jobs"
    min: 0
    max: 0
    arm: "both"
  - type: "regex"
    name: "no-verdict"
    pattern: "^\\W{0,6}(?:BID|MAYBE|SKIP)\\b"
    match: "not_contains"
