schema_version: "1.0"
name: poland
description: "A Rails post preferring Poland, from a client who has posted 109 jobs and hired on 6%."
context:
  scaffold_script: setup.sh
execution:
  prompt: "Screen Upwork job 2100921331325707992 for me."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write]
runs: 3
graders:
  - type: "regex"
    name: "verdict"
    pattern: "^\\W{0,6}SKIP\\b"
  - type: "regex"
    name: "low-hire-rate"
    pattern: "low-hire-rate"
    flags: "i"
  - type: "regex"
    name: "location-named"
    pattern: "location-preferred-elsewhere"
    flags: "i"
  - type: "tool_used"
    name: "ran-job-rules"
    tool: "Bash"
    input_match: "fixed_rules\\.py.{0,4}--job"
    min: 1
    weight: 0.5
  - type: "regex"
    name: "profile-org-uid"
    target: "mock_calls"
    pattern: "1000000000000000001"
    weight: 0.5
